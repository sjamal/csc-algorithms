[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csc-algorithms"
version = "1.0.0"
description = "Classic computer science algorithms in Python, exposed via an MCP server and a FastAPI HTTP API."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sarosh Jamal" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "mcp>=1.2.0,<2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["src*", "service*"]
