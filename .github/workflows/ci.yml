name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Suppresses Node.js fallback runtime annotations completely
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  validate_codebase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify and Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        # Fallback to manual setup if requirements.txt isn't in root
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "requirements.txt not found in root! Installing core packages directly."
          pip install pytest numpy black
        fi

    - name: Execute Automated Test Suite
      run: |
        pytest tests/

