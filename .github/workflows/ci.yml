name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  validate_codebase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Verify and Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        # Ensure our coverage plugin is fetched explicitly
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install pytest pytest-cov numpy black
        fi

    - name: Execute Automated Test Suite with Coverage Tracking
      run: |
        # Generates terminal outputs, an interactive HTML site, and an XML map
        pytest tests/ \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=html:htmlcov \
          --cov-report=xml:coverage.xml

    # Packages the generated interactive HTML site as a downloadable dashboard
    - name: Upload Core Coverage HTML Dashboard
      uses: actions/upload-artifact@v4
      with:
        name: algorithm-coverage-report
        path: htmlcov/

